[project]
name = "redimix-refactor"
version = "0.1.0"
description = "Refactored experiment package produced by LLM"
requires-python = ">=3.9"
dependencies = [
  "torch>=2.1.0",
  "torchvision>=0.16.0",
  "numpy>=1.21.0",
  "pyyaml>=6.0",
  "timm>=0.9.0",
  "transformers>=4.21.0",
  "diffusers>=0.21.0",
  "datasets>=2.0.0",
  "accelerate>=0.20.0",
  "matplotlib>=3.5.0",
]

[project.optional-dependencies]
# Development dependencies
dev = [
  "pytest>=7.0.0",
  "black>=22.0.0",
]

[build-system]
requires = ["setuptools", "wheel"]
