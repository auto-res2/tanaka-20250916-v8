[project]
name = "redimix-refactor"
version = "0.1.0"
description = "Refactored experiment package produced by LLM"
requires-python = ">=3.9"

[project.optional-dependencies]
# Runtime dependencies
default = [
  "torch>=2.1.0",
  "torchvision>=0.16.0",
  "numpy>=1.21.0",
  "pyyaml>=6.0",
]

[build-system]
requires = ["setuptools", "wheel"]
